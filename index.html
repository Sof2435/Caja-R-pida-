<script>
var S={uid:'',q:'',pq:'',dr:{},bcdb:{},rd:'',man:'',rate:0,prods:[],sales:[],closes:[],debts:[],cart:{},pm:'efusd',ed:0,z:0,cli:''};
var M={efusd:['Efectivo $','usd'],efbs:['Efectivo Bs','bs'],pmov:['Pago Móvil','bs'],zelle:['Zelle','usd'],tarj:['Tarjeta / punto','bs']};
function load(){try{var d=JSON.parse(localStorage.getItem('cajarapida:'+S.uid)||'null');if(d){['rate','rd','man','rdt','bcdb','prods','sales','closes','debts'].forEach(k=>{if(d[k])S[k]=d[k]})}}catch(e){}}
function save(){if(!S.uid)return;try{localStorage.setItem('cajarapida:'+S.uid,JSON.stringify({rate:S.rate,rd:S.rd,rdt:S.rdt,man:S.man,bcdb:S.bcdb,prods:S.prods,sales:S.sales,closes:S.closes,debts:S.debts}))}catch(e){}}
var num=v=>{var n=parseFloat(String(v).replace(',','.'));return isNaN(n)||n<0?0:n};
var f=n=>n.toLocaleString('es-VE',{minimumFractionDigits:2,maximumFractionDigits:2});
var CUR='USD',CS='$',CN='dólar',CP='dólares',usd=n=>CS+' '+f(n),bs=n=>'Bs '+f(n),$=i=>document.getElementById(i);
var esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
var mn=k=>M[k]?M[k][0]:'Sin método';
var dt=t=>{var d=new Date(t);return d.toLocaleDateString('es-VE')+' '+d.toLocaleTimeString('es-VE',{hour:'2-digit',minute:'2-digit'})};
var lst=a=>a.map(i=>i.q+' × '+esc(i.n)).join(', ');
var sel=()=>'<select class="f pmsel">'+Object.keys(M).filter(k=>k!=='zelle'||CUR==='USD').map(k=>'<option value="'+k+'"'+(k===S.pm?' selected':'')+'>'+M[k][0]+'</option>').join('')+'</select>';
var pu=p=>p.b!==undefined?(S.rate?p.b/S.rate:0):p.p,pb=p=>p.b!==undefined?p.b:p.p*S.rate,pd=p=>(p.b!==undefined?'≈ ':'')+usd(pu(p))+' · '+bs(pb(p));
function items(){return S.prods.filter(p=>S.cart[p.id]).map(p=>({n:p.n,q:S.cart[p.id]}))}
function tot(){return S.prods.reduce((u,p)=>u+(S.cart[p.id]||0)*pu(p),0)}
var nz=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
var normBC=c=>{c=String(c||'').replace(/\D/g,'');return c.length===12?'0'+c:c};
var byBC=(c,ex)=>S.prods.find(p=>p.bc&&normBC(p.bc)===c&&p.id!=ex);
var cats=()=>Object.keys(S.prods.reduce((o,p)=>{if(p.cat)o[p.cat]=1;return o},{})).sort((a,b)=>nz(a).localeCompare(nz(b)));
function find(q){var t=nz(q).split(/\s+/).filter(Boolean);if(!t.length)return[];var o=[];
S.prods.forEach(p=>{var n=nz(p.n),h=n+' '+nz(p.cat||'')+' '+(p.bc||'');if(t.every(w=>h.indexOf(w)>=0))o.push({p:p,s:n.indexOf(t[0])===0?0:1})});
o.sort((a,b)=>a.s-b.s||nz(a.p.n).localeCompare(nz(b.p.n)));return o}
var tt=0;function toast(m){var e=$('toast');e.textContent=m;e.hidden=false;clearTimeout(tt);tt=setTimeout(()=>{e.hidden=true},1900)}

function err(m){var e=$('a_er');if(e)e.textContent=m;var g=$('au_go');if(g)g.disabled=false;return false}
function lockd(){if(AU.lock>Date.now()){err('Demasiados intentos. Espera '+Math.ceil((AU.lock-Date.now())/1000)+' segundos.');return true}return false}
function fail(m){AU.fails++;if(AU.fails>=5){AU.fails=0;AU.lock=Date.now()+30000}return err(m)}
var validEm=e=>/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(e);
function doSignup(){var un=av('a_un').trim(),em=av('a_em').trim().toLowerCase(),p1=av('a_pw');
if(un.length<2)return err('Escribe tu nombre de usuario (mínimo 2 letras).');if(!validEm(em))return err('Escribe un correo válido.');
if(p1.length<6)return err('La contraseña debe tener al menos 6 caracteres.');
if(users().some(x=>x.em===em))return err('Ya existe una cuenta con ese correo. Inicia sesión.');
$('au_go').disabled=true;var salt=b64e(rnd(16));
pbk(p1,salt).then(h=>{var u={id:'u'+Date.now().toString(36)+Array.from(rnd(3)).map(x=>x.toString(16)).join(''),un:un,em:em,s:salt,h:h,biz:'',cur:'',setup:0,ts:Date.now()};
if(localStorage.getItem('cajarapida')&&!localStorage.getItem('cr_legacy_taken')){u.legacy=1;localStorage.setItem('cr_legacy_taken',u.id)}
putU(u);localStorage.setItem('cr_session',u.id);AU.u=u;showAuth('w1')}).catch(()=>err('No se pudo crear la cuenta en este teléfono.'))}
function doLogin(){if(lockd())return;var em=av('a_em').trim().toLowerCase(),pw=av('a_pw');if(!em||!pw)return err('Escribe tu correo y tu contraseña.');
var u=users().find(x=>x.em===em);$('au_go').disabled=true;
if(!u)return pbk(pw,b64e(rnd(16))).then(()=>fail('Correo o contraseña incorrectos.'));
pbk(pw,u.s).then(h=>{if(h!==u.h)return fail('Correo o contraseña incorrectos.');AU.fails=0;localStorage.setItem('cr_session',u.id);enterUser(u)}).catch(()=>err('No se pudo iniciar sesión.'))}
function doForgot(){if(lockd())return;var em=av('a_em').trim().toLowerCase(),rc=normCode(av('a_rc')),p1=av('a_pw');
if(!em||rc.length<12)return err('Escribe tu correo y el código de recuperación completo.');
if(p1.length<6)return err('La nueva contraseña debe tener al menos 6 caracteres.');
var u=users().find(x=>x.em===em);$('au_go').disabled=true;
if(!u||!u.rh)return pbk(rc,b64e(rnd(16))).then(()=>fail('Correo o código de recuperación incorrectos.'));
pbk(rc,u.rs).then(h=>{if(h!==u.rh)return fail('Correo o código de recuperación incorrectos.');AU.fails=0;
var s2=b64e(rnd(16)),rs=b64e(rnd(16)),code=newCode();
return Promise.all([pbk(p1,s2),pbk(normCode(code),rs)]).then(r=>{u.s=s2;u.h=r[0];u.rs=rs;u.rh=r[1];putU(u);AU.u=u;localStorage.setItem('cr_session',u.id);showAuth('newcode');AU.rc=code;$('a_code').textContent=code})}).catch(()=>err('No se pudo cambiar la contraseña.'))}
function doW1(){var b=av('a_biz').trim();if(!b)return err('Escribe el nombre de tu negocio.');AU.u.biz=b.slice(0,40);putU(AU.u);showAuth('w2')}
function doW2(){AU.u.cur=AU.u.legacy?'USD':(AU.cur||'USD');putU(AU.u);showAuth('w3')}
function doW3(){var u=AU.u,rs=b64e(rnd(16));$('au_go').disabled=true;
pbk(normCode(AU.rc),rs).then(h=>{u.rs=rs;u.rh=h;u.setup=1;
if(u.legacy&&!localStorage.getItem('cajarapida:'+u.id)){var l=localStorage.getItem('cajarapida');if(l)localStorage.setItem('cajarapida:'+u.id,l)}
putU(u);startSession(u)}).catch(()=>err('No se pudo terminar la configuración.'))}

function pfPw(){var o=av('pf_old'),n=av('pf_new'),u=AU.u;if(!o)return pfErr('Escribe tu contraseña actual.');if(n.length<6)return pfErr('La nueva contraseña debe tener al menos 6 caracteres.');
